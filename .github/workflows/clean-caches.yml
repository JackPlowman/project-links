name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  clean-caches:
    name: Clean Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write # Delete this repository's GitHub Actions caches.
    steps:
      - name: Delete caches
        run: gh cache delete --all --succeed-on-no-caches --repo "$GH_REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
